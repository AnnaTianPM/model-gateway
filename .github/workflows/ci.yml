name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Ruff format check
        run: ruff format --check

      - name: Ruff lint
        run: ruff check

      - name: Mypy
        run: mypy app/ --ignore-missing-imports || true

      - name: Pytest
        run: pytest -q

      - name: Docker build
        run: docker build -t model-gateway:ci .
